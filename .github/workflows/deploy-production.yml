# Force production deploys when main changes (UI + app).
# Vercel git auto-deploy appears stalled — this is the explicit path.
name: Deploy production

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/prod/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --prefer-offline || npm install

      - name: Pull Vercel env
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npx vercel pull --yes --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build + deploy production
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer pre-linked project ids when secrets exist
          if [ -z "${VERCEL_ORG_ID:-}" ]; then
            export VERCEL_ORG_ID="team_YY4Cuwg6dmgWa9eNW0aFAvjV"
          fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            export VERCEL_PROJECT_ID="prj_VTVGpU2Adqtu9oR7UwyIua87EAZ1"
          fi
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes

      - name: Fail loudly if no token
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "VERCEL_TOKEN secret missing — cannot deploy."
          echo "Add VERCEL_TOKEN (and optionally VERCEL_ORG_ID / VERCEL_PROJECT_ID) in repo secrets."
          exit 1
