name: Deploy production

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/prod/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci --prefer-offline || npm install

      - name: Install Vercel CLI
        run: npm i -g vercel@56.1.0

      - name: Build and deploy to production
        env:
          VERCEL_ORG_ID: team_YY4Cuwg6dmgWa9eNW0aFAvjV
          VERCEL_PROJECT_ID: prj_VTVGpU2Adqtu9oR7UwyIua87EAZ1
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_VTVGpU2Adqtu9oR7UwyIua87EAZ1","orgId":"team_YY4Cuwg6dmgWa9eNW0aFAvjV","projectName":"dualregistry"}' > .vercel/project.json
          EXTRA=()
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "Auth: VERCEL_TOKEN"
            EXTRA+=(--token="$VERCEL_TOKEN")
          else
            echo "Auth: attempting without token (OIDC / existing link)"
          fi
          vercel pull --yes --environment=production "${EXTRA[@]}" || echo "pull skipped/failed (ok if build has defaults)"
          vercel build --prod "${EXTRA[@]}"
          vercel deploy --prebuilt --prod --yes "${EXTRA[@]}"
