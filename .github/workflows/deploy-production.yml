# Deploy dualregistry to Vercel production.
# Requires secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vercel.json"
      - "tsconfig.json"
      - "public/**"
      - "scripts/**"
      - "migrations/**"
      - "skills/**"
      - "templates/**"
      - "server.json"
      - ".github/workflows/deploy-production.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN secret missing — cannot deploy via Actions"
            exit 1
          fi
          # Prefer project.json IDs when secrets not set
          export VERCEL_ORG_ID="${VERCEL_ORG_ID:-team_YY4Cuwg6dmgWa9eNW0aFAvjV}"
          export VERCEL_PROJECT_ID="${VERCEL_PROJECT_ID:-prj_VTVGpU2Adqtu9oR7UwyIua87EAZ1}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          export VERCEL_ORG_ID="${VERCEL_ORG_ID:-team_YY4Cuwg6dmgWa9eNW0aFAvjV}"
          export VERCEL_PROJECT_ID="${VERCEL_PROJECT_ID:-prj_VTVGpU2Adqtu9oR7UwyIua87EAZ1}"
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          export VERCEL_ORG_ID="${VERCEL_ORG_ID:-team_YY4Cuwg6dmgWa9eNW0aFAvjV}"
          export VERCEL_PROJECT_ID="${VERCEL_PROJECT_ID:-prj_VTVGpU2Adqtu9oR7UwyIua87EAZ1}"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
