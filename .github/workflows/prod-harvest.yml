# Harvest production high-water counters every 12 minutes (no probe).
# Soft GETs only — counters + probes (dashboard dropped to cut origin Active CPU).
# Keeps GitHub data/prod/* ahead of multi-instance Vercel /tmp races.
name: Production counter harvest

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prod-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull production high-water (soft)
        run: |
          set -euo pipefail
          BASE="https://www.dualregistry.dev"
          # Soft harvest: one probes + one counters. No dashboard (heavy).
          # ETag: if 304, keep previous GH floors (no write).
          ETAG_FILE="data/prod/.harvest-etag"
          ETAG=""
          if [ -f "$ETAG_FILE" ]; then ETAG=$(cat "$ETAG_FILE" || true); fi
          HDR=(-H "accept: application/json" -A "DualRegistryHarvest/2.0-soft")
          if [ -n "$ETAG" ]; then HDR+=(-H "If-None-Match: $ETAG"); fi

          CODE=$(curl -sS -m 45 -L "${HDR[@]}" \
            -D /tmp/probes-hdr.txt \
            -o /tmp/probes-api.json \
            -w "%{http_code}" \
            "${BASE}/api/probes?soft=1&t=$(date +%s)" || echo "000")
          echo "probes_http=$CODE"
          if [ "$CODE" = "304" ]; then
            echo "probes 304 — floors unchanged"
            exit 0
          fi
          # capture etag for next run
          grep -i '^etag:' /tmp/probes-hdr.txt | head -1 | sed 's/[Ee][Tt][Aa][Gg]: *//' | tr -d '\r' > "$ETAG_FILE" || true

          curl -sS -m 30 -L -A "DualRegistryHarvest/2.0-soft" \
            "${BASE}/api/counters?t=$(date +%s)" -o /tmp/counters-api.json || echo '{}' > /tmp/counters-api.json

          python3 - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone

          def loadj(path):
              try:
                  return json.loads(pathlib.Path(path).read_text())
              except Exception:
                  return {}

          p = loadj("/tmp/probes-api.json")
          c = loadj("/tmp/counters-api.json")
          pr = p.get("probes") or {}
          used = int(pr.get("used") or 0)
          last = pr.get("last_tick_at") or ""
          lv = pr.get("live_active") or {}
          live = {
              "total": int(lv.get("total") or 0),
              "mcp": int(lv.get("mcp") or 0),
              "agents": int(lv.get("agents") or 0),
              "at": lv.get("at") or "",
          }
          recent = list(p.get("recent") or [])
          cc = c.get("counters") or c
          used = max(used, int(cc.get("probes_used") or 0))
          live["total"] = max(int(live["total"] or 0), int(cc.get("live_ok") or 0))
          live["mcp"] = max(int(live["mcp"] or 0), int(cc.get("live_mcp") or 0))
          live["agents"] = max(int(live["agents"] or 0), int(cc.get("live_agents") or 0))

          day = (last or datetime.now(timezone.utc).isoformat())[:10]
          print("harvest used", used, "last", last, "live", live.get("total"))

          def load(path):
              path = pathlib.Path(path)
              if path.exists():
                  try:
                      return json.loads(path.read_text())
                  except Exception:
                      return {}
              return {}

          floors = load("data/prod/counter-floors.json")
          probes = load("data/prod/probes.json")
          livec = load("data/prod/live-counters.json")

          floors["day"] = day
          floors["used_floor"] = max(int(floors.get("used_floor") or 0), used)
          fl = floors.get("live_floor") or {}
          floors["live_floor"] = {
              "total": max(int(fl.get("total") or 0), int(live.get("total") or 0)),
              "mcp": max(int(fl.get("mcp") or 0), int(live.get("mcp") or 0)),
              "agents": max(int(fl.get("agents") or 0), int(live.get("agents") or 0)),
              "at": max(fl.get("at") or "", live.get("at") or ""),
          }
          floors["delisted_floor"] = max(int(floors.get("delisted_floor") or 0), int(cc.get("delisted_count") or 0))
          prev_lt = floors.get("last_tick_floor") or ""
          floors["last_tick_floor"] = last if last >= prev_lt else prev_lt
          floors["updated_at"] = datetime.now(timezone.utc).isoformat()

          probes["day"] = day
          probes["used"] = max(int(probes.get("used") or 0), used, floors["used_floor"])
          if last and last >= (probes.get("last_tick_at") or ""):
              probes["last_tick_at"] = last
          probes["live_active_snapshot"] = floors["live_floor"]
          by = {}
          for t in (probes.get("tick_log") or []):
              tid = t.get("tick_id") or f"{t.get('probed_at')}|{t.get('id')}"
              by[tid] = t
          for r in recent:
              if not r.get("probed_at"):
                  continue
              tid = f"{r['probed_at']}|{r.get('id')}|{r.get('handshake')}"
              by[tid] = {
                  "tick_id": tid,
                  "id": r.get("id"),
                  "kind": r.get("kind"),
                  "handshake": r.get("handshake"),
                  "ok": r.get("ok"),
                  "target": r.get("target"),
                  "signals": (r.get("signals") or [])[:6],
                  "probed_at": r["probed_at"],
                  "spent_budget": True,
              }
          probes["tick_log"] = sorted(by.values(), key=lambda x: x.get("probed_at") or "", reverse=True)[:400]

          livec["day"] = day
          livec["probes_used"] = max(int(livec.get("probes_used") or 0), used, floors["used_floor"])
          livec["live_ok"] = floors["live_floor"]["total"]
          livec["live_mcp"] = floors["live_floor"]["mcp"]
          livec["live_agents"] = floors["live_floor"]["agents"]
          livec["delisted_count"] = max(int(livec.get("delisted_count") or 0), floors["delisted_floor"])
          livec["updated_at"] = floors["updated_at"]
          livec["backend"] = "harvest-soft-12m"

          pathlib.Path("data/prod").mkdir(parents=True, exist_ok=True)
          pathlib.Path("data/prod/counter-floors.json").write_text(json.dumps(floors, indent=2))
          pathlib.Path("data/prod/probes.json").write_text(json.dumps(probes, indent=2))
          pathlib.Path("data/prod/live-counters.json").write_text(json.dumps(livec, indent=2))
          print("wrote floors used", floors["used_floor"], "last", probes.get("last_tick_at"))
          PY

      - name: Commit (conflict-safe max-merge)
        run: bash scripts/harvest-commit.sh
