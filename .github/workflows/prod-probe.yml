# Production probe scheduler — every 6 minutes.
# 1) Hits dualregistry.dev probe tick (Vercel Cron is primary; this is backup + durable commit)
# 2) Commits durable state with MAX-merge so used/live/delist never regress
name: Production probe tick

on:
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prod-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run production probe tick
        id: tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Prefer www to avoid apex 308; -L follows redirects either way
          PROBE_URL: https://www.dualregistry.dev/api/cron/probe
        run: |
          set -euo pipefail
          HDR=()
          if [ -n "${CRON_SECRET:-}" ]; then
            HDR=(-H "Authorization: Bearer ${CRON_SECRET}" -H "x-cron-secret: ${CRON_SECRET}")
          fi
          curl -sS -L -m 90 -X POST "${PROBE_URL}" \
            -H "accept: application/json" \
            -H "content-type: application/json" \
            -H "user-agent: DualRegistryActionsProbe/1.0" \
            "${HDR[@]}" \
            -d '{}' \
            -o /tmp/probe-tick.json \
            -w "http=%{http_code}\n"
          head -c 400 /tmp/probe-tick.json; echo
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("/tmp/probe-tick.json")
          d = json.loads(p.read_text())
          if not d.get("ok"):
              print("tick failed", d)
              sys.exit(0)
          commit = d.get("commit") or {}

          def max_merge_probes(existing, incoming):
              day = incoming.get("day") or existing.get("day")
              out = {**existing, **incoming}
              out["day"] = day
              used = max(int(existing.get("used") or 0), int(incoming.get("used") or 0))
              results = {**(existing.get("results") or {})}
              for k, r in (incoming.get("results") or {}).items():
                  prev = results.get(k)
                  if not prev or (r.get("probed_at") or "") >= (prev.get("probed_at") or ""):
                      results[k] = r
              seen=set(); today=0
              for k,r in results.items():
                  if k.startswith("name:") or k.startswith("url:"): continue
                  if not (r.get("probed_at") or "").startswith(day or ""): continue
                  if any("preflight-reject" in str(s) for s in (r.get("signals") or [])): continue
                  if any("bulk-prefilter" in str(s) for s in (r.get("signals") or [])): continue
                  uid=str(r.get("id") or k)
                  if uid in seen: continue
                  seen.add(uid); today+=1
              out["used"] = max(used, today)
              out["results"] = results
              # Merge append-only tick_log (union by tick_id)
              by = {}
              for src in (existing.get("tick_log") or [], incoming.get("tick_log") or []):
                  for t in src:
                      if not t: continue
                      tid = t.get("tick_id") or f"{t.get('probed_at')}|{t.get('id')}|{t.get('handshake')}"
                      prev = by.get(tid)
                      if not prev or (t.get("probed_at") or "") >= (prev.get("probed_at") or ""):
                          by[tid] = {**t, "tick_id": tid}
              out["tick_log"] = sorted(by.values(), key=lambda x: x.get("probed_at") or "", reverse=True)[:400]
              la = existing.get("live_active_snapshot") or {}
              lb = incoming.get("live_active_snapshot") or {}
              out["live_active_snapshot"] = {
                  "total": max(int(la.get("total") or 0), int(lb.get("total") or 0)),
                  "mcp": max(int(la.get("mcp") or 0), int(lb.get("mcp") or 0)),
                  "agents": max(int(la.get("agents") or 0), int(lb.get("agents") or 0)),
                  "at": max(la.get("at") or "", lb.get("at") or ""),
              }
              for key in ("last_tick_at", "last_ok_tick_at", "updated_at"):
                  a, b = existing.get(key) or "", incoming.get(key) or ""
                  out[key] = a if a >= b else b
              # Prefer API last_tick if newer
              api_last = d.get("last_tick_at") or ""
              if api_last and api_last >= (out.get("last_tick_at") or ""):
                  out["last_tick_at"] = api_last
              return out

          def max_merge_floors(existing, incoming):
              day = incoming.get("day") or existing.get("day")
              out = {**existing, **incoming}
              out["day"] = day
              used = 0
              if existing.get("day") == day:
                  used = max(used, int(existing.get("used_floor") or 0))
              if incoming.get("day") == day:
                  used = max(used, int(incoming.get("used_floor") or 0))
              used = max(used, int(d.get("used_today") or 0))
              out["used_floor"] = used
              la = existing.get("live_floor") or {}
              lb = incoming.get("live_floor") or {}
              out["live_floor"] = {
                  "total": max(int(la.get("total") or 0), int(lb.get("total") or 0)),
                  "mcp": max(int(la.get("mcp") or 0), int(lb.get("mcp") or 0)),
                  "agents": max(int(la.get("agents") or 0), int(lb.get("agents") or 0)),
                  "at": max(la.get("at") or "", lb.get("at") or ""),
              }
              out["delisted_floor"] = max(int(existing.get("delisted_floor") or 0), int(incoming.get("delisted_floor") or 0))
              bu = list(set((existing.get("blocked_urls") or []) + (incoming.get("blocked_urls") or [])))
              bi = list(set((existing.get("blocked_ids") or []) + (incoming.get("blocked_ids") or [])))
              out["blocked_urls"] = bu[:5000]
              out["blocked_ids"] = bi[:5000]
              return out

          def max_merge_live_counters(existing, incoming):
              day = incoming.get("day") or existing.get("day")
              out = {**existing, **incoming}
              out["day"] = day
              used = 0
              if existing.get("day") == day:
                  used = max(used, int(existing.get("probes_used") or 0))
              if incoming.get("day") == day:
                  used = max(used, int(incoming.get("probes_used") or 0))
              used = max(used, int(d.get("used_today") or 0))
              out["probes_used"] = used
              for k in ("live_ok", "live_mcp", "live_agents", "delisted_count"):
                  out[k] = max(int(existing.get(k) or 0), int(incoming.get(k) or 0))
              return out

          def max_merge_delisted(existing, incoming):
              by = {}
              for src in (existing, incoming):
                  for it in (src.get("items") or []):
                      if not it or not it.get("id"): continue
                      prev = by.get(it["id"])
                      if not prev or (it.get("delisted_at") or "") >= (prev.get("delisted_at") or ""):
                          by[it["id"]] = it
              items = list(by.values())
              return {
                  "updated_at": max(existing.get("updated_at") or "", incoming.get("updated_at") or ""),
                  "items": items,
                  "active_ids": [i["id"] for i in items],
              }

          def max_merge_clean(existing, incoming):
              items = {}
              for src in (existing, incoming):
                  for k, it in (src.get("items") or {}).items():
                      if not it or not isinstance(it, dict):
                          continue
                      iid = it.get("id") or k
                      if not iid:
                          continue
                      prev = items.get(iid)
                      if not prev:
                          items[iid] = {**it, "id": iid}
                          continue
                      # keep earliest approved_at, newest probed_at, max score
                      items[iid] = {
                          **prev,
                          **it,
                          "id": iid,
                          "approved_at": min(
                              prev.get("approved_at") or it.get("approved_at") or "",
                              it.get("approved_at") or prev.get("approved_at") or "",
                          ) or (prev.get("approved_at") or it.get("approved_at")),
                          "probed_at": max(
                              prev.get("probed_at") or "",
                              it.get("probed_at") or "",
                          ),
                          "score": max(int(prev.get("score") or 0), int(it.get("score") or 0)),
                          "handshake": "ok",
                      }
              mcp = sum(1 for it in items.values() if it.get("kind") == "mcp")
              agents = sum(1 for it in items.values() if it.get("kind") == "agent")
              total = len(items)
              hw_e = existing.get("high_water") or {}
              hw_i = incoming.get("high_water") or {}
              high_water = {
                  "total": max(int(hw_e.get("total") or 0), int(hw_i.get("total") or 0), total),
                  "mcp": max(int(hw_e.get("mcp") or 0), int(hw_i.get("mcp") or 0), mcp),
                  "agents": max(int(hw_e.get("agents") or 0), int(hw_i.get("agents") or 0), agents),
              }
              return {
                  "day": incoming.get("day") or existing.get("day"),
                  "updated_at": max(existing.get("updated_at") or "", incoming.get("updated_at") or ""),
                  "counts": {"total": total, "mcp": mcp, "agents": agents},
                  "high_water": high_water,
                  "items": items,
                  "policy": incoming.get("policy") or existing.get("policy") or {},
              }

          for rel, content in commit.items():
              if not content:
                  continue
              path = pathlib.Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              try:
                  incoming = json.loads(content) if isinstance(content, str) else content
              except Exception:
                  path.write_text(content if isinstance(content, str) else json.dumps(content))
                  continue
              existing = {}
              if path.exists():
                  try:
                      existing = json.loads(path.read_text())
                  except Exception:
                      existing = {}
              if not isinstance(existing, dict):
                  existing = {}
              if rel.endswith("probes.json"):
                  merged = max_merge_probes(existing, incoming)
              elif rel.endswith("counter-floors.json"):
                  merged = max_merge_floors(existing, incoming)
              elif rel.endswith("live-counters.json"):
                  merged = max_merge_live_counters(existing, incoming)
              elif rel.endswith("delisted.json"):
                  merged = max_merge_delisted(existing, incoming)
              elif rel.endswith("clean-registry.json"):
                  merged = max_merge_clean(existing, incoming)
              else:
                  merged = {**existing, **incoming}
              path.write_text(json.dumps(merged, indent=2))
              print("wrote", rel, "bytes", path.stat().st_size)

          floors_path = pathlib.Path("data/prod/counter-floors.json")
          probes_path = pathlib.Path("data/prod/probes.json")
          live_path = pathlib.Path("data/prod/live-counters.json")
          if probes_path.exists():
              probes = json.loads(probes_path.read_text())
              floors = json.loads(floors_path.read_text()) if floors_path.exists() else {
                  "day": probes.get("day"), "used_floor": 0,
                  "live_floor": {"total":0,"mcp":0,"agents":0,"at":""},
                  "delisted_floor": 0, "blocked_urls": [], "blocked_ids": []
              }
              livec = json.loads(live_path.read_text()) if live_path.exists() else {
                  "day": probes.get("day"), "probes_used": 0, "live_ok": 0,
                  "live_mcp": 0, "live_agents": 0, "delisted_count": 0
              }
              day = probes.get("day")
              max_used = max(
                  int(floors.get("used_floor") or 0),
                  int(probes.get("used") or 0),
                  int(livec.get("probes_used") or 0),
                  int(d.get("used_today") or 0),
              )
              floors["day"] = day
              floors["used_floor"] = max_used
              live = probes.get("live_active_snapshot") or {}
              fl = floors.get("live_floor") or {}
              floors["live_floor"] = {
                  "total": max(int(fl.get("total") or 0), int(live.get("total") or 0), int(livec.get("live_ok") or 0)),
                  "mcp": max(int(fl.get("mcp") or 0), int(live.get("mcp") or 0), int(livec.get("live_mcp") or 0)),
                  "agents": max(int(fl.get("agents") or 0), int(live.get("agents") or 0), int(livec.get("live_agents") or 0)),
                  "at": max(fl.get("at") or "", live.get("at") or ""),
              }
              floors_path.parent.mkdir(parents=True, exist_ok=True)
              floors_path.write_text(json.dumps(floors, indent=2))
              probes["used"] = max_used
              # last_tick high-water from API + existing
              api_last = d.get("last_tick_at") or ""
              if api_last and api_last >= (probes.get("last_tick_at") or ""):
                  probes["last_tick_at"] = api_last
              probes_path.write_text(json.dumps(probes, indent=2))
              livec["day"] = day
              livec["probes_used"] = max_used
              livec["live_ok"] = max(int(livec.get("live_ok") or 0), int(floors["live_floor"]["total"]))
              livec["live_mcp"] = max(int(livec.get("live_mcp") or 0), int(floors["live_floor"]["mcp"]))
              livec["live_agents"] = max(int(livec.get("live_agents") or 0), int(floors["live_floor"]["agents"]))
              live_path.parent.mkdir(parents=True, exist_ok=True)
              live_path.write_text(json.dumps(livec, indent=2))
              print("locked used", max_used, "live", livec["live_ok"], "last", probes.get("last_tick_at"))
          print("probed", d.get("probed"), "used", d.get("used_today"), "live_ok", d.get("live_active_probe_ok"))
          PY

      - name: Commit durable probe state
        run: |
          set -euo pipefail
          git config user.name "dualregistry-probe[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prod || true
          if git diff --staged --quiet; then
            echo "No durable state changes"
            exit 0
          fi
          git commit -m "chore(prod): durable probe state (max-merge) $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push
